<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk to Jobber</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; font-size: 18px; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .sub { color: #555; font-size: 16px; margin-top: 0; }
  button { font-size: 18px; padding: 10px 18px; cursor: pointer; border-radius: 8px; }
  #talkBtn {
    width: 100%; padding: 32px; font-size: 22px; font-weight: 600; margin-top: 20px;
    background: #1a73e8; color: #fff; border: none; touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #talkBtn.live { background: #b00020; }
  #talkBtn.busy { background: #888; }
  #status { margin-top: 12px; color: #555; font-size: 16px; min-height: 22px; }
  #log { margin-top: 20px; max-height: 380px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-size: 16px; display: none; }
  .line { margin: 6px 0; word-wrap: break-word; }
  .line.tool, .line.result { color: #555; }
  .line.result.ok { color: #137333; }
  .ok { color: #137333; } .err { color: #b00020; }
  details { margin-top: 40px; border-top: 1px solid #ddd; padding-top: 16px; }
  summary { cursor: pointer; color: #555; font-size: 16px; }
  textarea { width: 100%; font-size: 18px; padding: 12px; box-sizing: border-box; margin-top: 12px; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-top: 20px; display: none; }
  .row { margin: 8px 0; }
  label { display: inline-block; width: 130px; font-weight: 600; }
  input { font-size: 18px; padding: 6px; width: 320px; max-width: 100%; }
  #result { margin-top: 20px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Talk to Jobber</h1>
  <p class="sub">Hold the button and describe the client and the job. It asks for anything missing, reads it back, and creates the quote once you say yes.</p>

  <button id="talkBtn">Hold to talk</button>
  <div id="status">Hold the button to start.</div>

  <div id="log"></div>
  <audio id="agentAudio" autoplay playsinline></audio>

<script>
const $ = id => document.getElementById(id);

// Teardown waits until the agent's audio actually goes silent, not just until
// the model finishes generating. These tune that detection.
const SILENCE_HOLD_MS = 900;      // how long it must stay quiet before we call it done
const SILENCE_THRESHOLD = 3;      // 0-128. Raise if it never detects silence.
const NO_AUDIO_GIVEUP_MS = 4000;  // if no speech ever starts, stop waiting
const MAX_WAIT_MS = 30000;        // hard cap so it can never hang
const FINISH_FALLBACK_MS = 6000;  // used only if the analyser can't be created

// How long after you release before it answers.
// Hold again within this window to keep adding to the same request.
const SEND_DELAY_MS = 2500;

// Last-resort backstop only. Hold as long as you want - a normal long request
// is nowhere near this. Real interruptions are caught by the focus/visibility
// handlers below instead, which fire immediately rather than on a timer.
const MAX_HOLD_MS = 600000;   // 10 minutes

let pc = null, dc = null, micTrack = null, micStream = null;
let state = "idle";            // idle | connecting | ready
let holding = false;
let finishAfterResponse = false;
let sendTimer = null;
let turnActive = false;        // you've started a turn, not yet sent
let spoke = false;             // mic actually opened during this turn
let responseInProgress = false;
let holdGuard = null;
let audioCtx = null, analyser = null, analyserData = null, finishWatcher = null;

function setStatus(t) { $("status").textContent = t; }

function setButton() {
  const b = $("talkBtn");
  b.classList.remove("live", "busy");
  if (state === "connecting") { b.textContent = "Connecting..."; b.classList.add("busy"); }
  else if (state === "ready" && holding) { b.textContent = "Listening - release when done"; b.classList.add("live"); }
  else { b.textContent = "Hold to talk"; }
}

function log(who, text, cls) {
  $("log").style.display = "block";
  const d = document.createElement("div");
  d.className = "line " + (cls || "");
  d.innerHTML = "<b>" + who + ":</b> " + String(text).replace(/</g, "&lt;");
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

function clearForm() {
  ["firstName","lastName","companyName","email","phone","street1","street2",
   "city","province","postalCode","country","lineItemName","unitPrice","quantity"]
    .forEach(id => { if ($(id)) $(id).value = ""; });
  if ($("confirm")) $("confirm").style.display = "none";
  if ($("result")) $("result").textContent = "";
  if ($("prompt")) $("prompt").value = "";
}

function endSession(msg) {
  clearInterval(finishWatcher);
  finishWatcher = null;
  try { if (audioCtx) audioCtx.close(); } catch (e) {}
  audioCtx = null; analyser = null; analyserData = null;
  try { if (dc) dc.close(); } catch (e) {}
  try { if (pc) pc.close(); } catch (e) {}
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  pc = dc = micTrack = micStream = null;
  state = "idle";
  holding = false;
  finishAfterResponse = false;
  clearTimeout(sendTimer);
  sendTimer = null;
  clearTimeout(holdGuard);
  holdGuard = null;
  turnActive = false;
  spoke = false;
  responseInProgress = false;
  setButton();
  setStatus(msg || "Hold the button to start.");
  clearForm();
}

// --- Detecting when the agent has actually finished speaking ---
// response.done fires when the model stops generating, which is well before
// the speaker stops playing. So we listen to the real audio instead.

function setupPlaybackAnalyser(stream) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { analyser = null; return; }
    audioCtx = new Ctx();
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyserData = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);   // tap only - not connected to output, so no double audio
  } catch (err) {
    analyser = null;         // fall back to the fixed timer
  }
}

function agentIsSpeaking() {
  if (!analyser) return false;
  analyser.getByteTimeDomainData(analyserData);
  let peak = 0;
  for (let i = 0; i < analyserData.length; i++) {
    const v = Math.abs(analyserData[i] - 128);
    if (v > peak) peak = v;
  }
  return peak > SILENCE_THRESHOLD;
}

function whenFinishedSpeaking(cb) {
  clearInterval(finishWatcher);
  if (!analyser) { setTimeout(cb, FINISH_FALLBACK_MS); return; }

  const started = Date.now();
  let sawSpeech = false;
  let quietSince = null;

  finishWatcher = setInterval(() => {
    const elapsed = Date.now() - started;

    if (agentIsSpeaking()) {
      sawSpeech = true;
      quietSince = null;
    } else if (sawSpeech) {
      if (quietSince === null) quietSince = Date.now();
      if (Date.now() - quietSince >= SILENCE_HOLD_MS) {
        clearInterval(finishWatcher); finishWatcher = null; cb(); return;
      }
    } else if (elapsed > NO_AUDIO_GIVEUP_MS) {
      // Audio never started. Nothing to wait for.
      clearInterval(finishWatcher); finishWatcher = null; cb(); return;
    }

    if (elapsed > MAX_WAIT_MS) {
      clearInterval(finishWatcher); finishWatcher = null; cb();
    }
  }, 100);
}

async function connect() {
  state = "connecting";
  setButton();
  setStatus("Connecting...");
  $("log").innerHTML = "";
  $("log").style.display = "none";
  clearForm();

  try {
    const tokenRes = await fetch("/session");
    const tokenData = await tokenRes.json();
    if (tokenData.error) throw new Error(JSON.stringify(tokenData).slice(0, 300));
    const KEY = tokenData.value || tokenData.client_secret?.value;
    if (!KEY) throw new Error("No client secret in /session response: " + JSON.stringify(tokenData).slice(0, 200));

    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    micTrack = micStream.getAudioTracks()[0];
    micTrack.enabled = false;

    pc = new RTCPeerConnection();
    pc.ontrack = e => {
      $("agentAudio").srcObject = e.streams[0];
      $("agentAudio").play().catch(() => {});
      setupPlaybackAnalyser(e.streams[0]);
    };
    pc.addTrack(micTrack, micStream);

    dc = pc.createDataChannel("oai-events");
    dc.onmessage = handleEvent;
    dc.onopen = () => {
      state = "ready";
      if (holding && micTrack) {
        // You held the button to connect and never let go - start the turn properly.
        try { dc.send(JSON.stringify({ type: "input_audio_buffer.clear" })); } catch (err) {}
        turnActive = true;
        spoke = true;
        micTrack.enabled = true;
        setStatus("Listening...");
      } else {
        setStatus("Ready - hold the button and speak.");
      }
      setButton();
    };

    pc.onconnectionstatechange = () => {
      if (!pc) return;
      if (["failed", "disconnected", "closed"].includes(pc.connectionState)) {
        endSession("Connection dropped. Hold the button to start again.");
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const sdpRes = await fetch("https://api.openai.com/v1/realtime/calls", {
      method: "POST",
      body: offer.sdp,
      headers: { "Authorization": "Bearer " + KEY, "Content-Type": "application/sdp" }
    });
    const answerSdp = await sdpRes.text();
    if (!sdpRes.ok) throw new Error("SDP exchange failed (HTTP " + sdpRes.status + "): " + answerSdp.slice(0, 300));
    await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });

  } catch (e) {
    endSession("Error: " + e.message);
  }
}

// --- One button, three jobs: connect, talk, and get out of the way ---
$("talkBtn").addEventListener("pointerdown", e => {
  e.preventDefault();
  // Capture means this button gets the release even if your finger drifts off it.
  try { $("talkBtn").setPointerCapture(e.pointerId); } catch (err) {}
  holding = true;
  clearTimeout(sendTimer);
  clearTimeout(holdGuard);
  holdGuard = setTimeout(() => release(), MAX_HOLD_MS);

  if (state === "idle") { connect(); }
  else if (state === "ready" && micTrack) {
    // If it's mid-sentence, cut it off. You have the floor.
    if (responseInProgress) {
      try { dc.send(JSON.stringify({ type: "response.cancel" })); } catch (err) {}
      responseInProgress = false;
    }
    // First hold of a new turn: drop the silence that piled up since the last one.
    if (!turnActive) {
      try { dc.send(JSON.stringify({ type: "input_audio_buffer.clear" })); } catch (err) {}
      turnActive = true;
    }
    micTrack.enabled = true;
    spoke = true;
    setStatus("Listening...");
  }
  setButton();
});

function release(e) {
  if (e) e.preventDefault();
  if (!holding) return;
  holding = false;
  clearTimeout(holdGuard);
  if (state === "ready" && micTrack) {
    micTrack.enabled = false;
    setStatus("Hold again to add more...");
    clearTimeout(sendTimer);
    sendTimer = setTimeout(sendTurn, SEND_DELAY_MS);
  }
  setButton();
}

// These registrations are what actually stop the mic. Without them the button
// never hears the release. The window listeners are a backstop in case capture fails.
["pointerup", "pointercancel"].forEach(ev =>
  $("talkBtn").addEventListener(ev, release)
);
["pointerup", "pointercancel", "touchend", "touchcancel"].forEach(ev =>
  window.addEventListener(ev, release)
);

// The real reasons a hold gets orphaned: a call comes in, you switch apps,
// the screen locks. These fire right away instead of waiting on a timer.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) release();
});
window.addEventListener("blur", () => release());
window.addEventListener("pagehide", () => release());
$("talkBtn").addEventListener("contextmenu", e => e.preventDefault());

function sendTurn() {
  if (state !== "ready" || !turnActive || !spoke) return;
  turnActive = false;
  spoke = false;
  setStatus("Thinking...");
  try {
    dc.send(JSON.stringify({ type: "input_audio_buffer.commit" }));
    dc.send(JSON.stringify({ type: "response.create" }));
    responseInProgress = true;
  } catch (err) {
    log("Error", "Could not send turn: " + err, "err");
  }
}

// --- Realtime events ---
async function handleEvent(e) {
  let ev;
  try { ev = JSON.parse(e.data); } catch (err) { return; }

  if (ev.type === "response.function_call_arguments.done") {
    await runTool(ev.name, ev.call_id, ev.arguments);
  } else if (ev.type === "response.output_audio_transcript.done" || ev.type === "response.audio_transcript.done") {
    log("Assistant", ev.transcript || "");
  } else if (ev.type === "conversation.item.input_audio_transcription.completed") {
    log("You", ev.transcript || "");
  } else if (ev.type === "response.created") {
    responseInProgress = true;
  } else if (ev.type === "response.done") {
    responseInProgress = false;
    if (finishAfterResponse) {
      finishAfterResponse = false;
      setStatus("Finishing up...");
      whenFinishedSpeaking(() => endSession("Done. Hold the button for a new request."));
    }
  } else if (ev.type === "error") {
    console.error("[realtime error]", ev.error || ev);
    log("Error", (ev.error && ev.error.message) ? ev.error.message : "Connection problem - see console.", "err");
  }
}

// The log is visible to whoever is watching the screen, so it shows plain
// status lines. Raw tool payloads carry model-facing instructions that would
// be confusing out of context, so they go to the console instead.
function describeCall(name, args) {
  if (name === "create_client") {
    const who = [args.firstName, args.lastName].filter(Boolean).join(" ")
      || args.companyName || "client";
    const where = args.city || args.street1;
    return "Creating client " + who + (where ? " in " + where : "") + "...";
  }
  if (name === "create_quote") {
    const n = Array.isArray(args.lineItems) ? args.lineItems.length : 0;
    return "Creating quote with " + n + (n === 1 ? " line item..." : " line items...");
  }
  return "Working...";
}

function describeResult(name, result) {
  if (!result.ok) {
    // Server errors carry a short problem statement followed by instructions
    // for the model. Only the first sentence is meant for a human to read.
    const first = String(result.error || "unknown error").split(/(?<=\.)\s+/)[0];
    return "Couldn't complete that - " + first;
  }
  if (name === "create_client") {
    return "Created client " + (result.name || "") + (result.city ? " in " + result.city : "");
  }
  if (name === "create_quote") {
    return "Created quote" + (result.total ? " totaling " + result.total : "");
  }
  return "Done";
}

async function runTool(name, callId, argsJson) {
  let args = {};
  try { args = JSON.parse(argsJson || "{}"); } catch (e) {}
  console.log("[tool call]", name, args);
  log("Jobber", describeCall(name, args), "tool");

  let result;
  try {
    const r = await fetch("/tool/" + name, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(args)
    });
    result = await r.json();
  } catch (err) {
    result = { ok: false, error: String(err) };
  }
  console.log("[tool result]", name, result);
  log("Jobber", describeResult(name, result), result.ok ? "result ok" : "result err");

  if (name === "create_quote" && result.ok) {
    finishAfterResponse = true;
  }

  try {
    dc.send(JSON.stringify({
      type: "conversation.item.create",
      item: { type: "function_call_output", call_id: callId, output: JSON.stringify(result) }
    }));
    dc.send(JSON.stringify({ type: "response.create" }));
  } catch (err) {
    log("Error", "Could not send tool result: " + err, "err");
  }
}
</script>

<details>
  <summary>Manual mode (type it instead)</summary>

  <textarea id="prompt" rows="3" placeholder='New client Mike Torres at Torres HVAC, email mike@torreshvac.com, water heater replacement for $2,400.'></textarea><br>
  <button id="recordBtn">Record</button>
  <button id="parseBtn">Parse</button>
  <span id="recStatus" style="margin-left:10px;color:#b00020;"></span>

  <div class="card" id="confirm">
    <div class="row"><label>First name</label><input id="firstName"></div>
    <div class="row"><label>Last name</label><input id="lastName"></div>
    <div class="row"><label>Company</label><input id="companyName"></div>
    <div class="row"><label>Email</label><input id="email"></div>
    <div class="row"><label>Phone</label><input id="phone"></div>
    <div class="row"><label>Street</label><input id="street1"></div>
    <div class="row"><label>Street 2</label><input id="street2"></div>
    <div class="row"><label>City</label><input id="city"></div>
    <div class="row"><label>State</label><input id="province"></div>
    <div class="row"><label>Zip</label><input id="postalCode"></div>
    <div class="row"><label>Country</label><input id="country"></div>
    <div class="row"><label>Quote item</label><input id="lineItemName"></div>
    <div class="row"><label>Unit price</label><input id="unitPrice"></div>
    <div class="row"><label>Quantity</label><input id="quantity"></div>
    <button id="sendBtn">Send to Jobber</button>
  </div>

  <div id="result"></div>
</details>

<script>
let mediaRecorder, audioChunks = [];

$("recordBtn").onclick = async () => {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      $("recordBtn").textContent = "Record";
      $("recStatus").textContent = "Transcribing...";
      const blob = new Blob(audioChunks, { type: "audio/webm" });
      const res = await fetch("/transcribe", {
        method: "POST",
        headers: { "content-type": "audio/webm" },
        body: blob
      });
      const data = await res.json();
      if (data.error) { $("recStatus").textContent = "Error: " + JSON.stringify(data); return; }
      $("prompt").value = data.text || "";
      $("recStatus").textContent = "";
      parseText();
    };
    mediaRecorder.start();
    $("recordBtn").textContent = "Stop";
    $("recStatus").textContent = "Recording...";
  } catch (e) {
    $("recStatus").textContent = "Mic error: " + e;
  }
};

async function parseText() {
  $("result").textContent = "Parsing...";
  const res = await fetch("/parse", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ text: $("prompt").value })
  });
  const data = await res.json();
  if (data.error) { $("result").innerHTML = '<span class="err">Parse error: ' + JSON.stringify(data) + '</span>'; return; }
  $("firstName").value = data.firstName || "";
  $("lastName").value = data.lastName || "";
  $("companyName").value = data.companyName || "";
  $("email").value = data.email || "";
  $("phone").value = data.phone || "";
  $("street1").value = data.street1 || "";
  $("street2").value = data.street2 || "";
  $("city").value = data.city || "";
  $("province").value = data.province || "";
  $("postalCode").value = data.postalCode || "";
  $("country").value = data.country || "";
  $("lineItemName").value = data.lineItemName || "";
  $("unitPrice").value = data.unitPrice || "";
  $("quantity").value = data.quantity || "";
  $("confirm").style.display = "block";
}
$("parseBtn").onclick = parseText;

$("sendBtn").onclick = async () => {
  $("result").textContent = "Creating client in Jobber...";
  const res = await fetch("/create-client", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      firstName: $("firstName").value,
      lastName: $("lastName").value,
      companyName: $("companyName").value,
      email: $("email").value,
      phone: $("phone").value,
      street1: $("street1").value,
      street2: $("street2").value,
      city: $("city").value,
      province: $("province").value,
      postalCode: $("postalCode").value,
      country: $("country").value
    })
  });
  const data = await res.json();
  const errs = data?.data?.clientCreate?.userErrors;
  const client = data?.data?.clientCreate?.client;
  if (client && client.id) {
    const propertyId = client.clientProperties?.nodes?.[0]?.id;
    $("result").innerHTML = '<span class="ok">Created client ' + (client.firstName||"") + ' ' + (client.lastName||"") + ' (ID: ' + client.id + ')</span>';
    if (propertyId && ($("lineItemName").value || $("unitPrice").value)) {
      $("result").innerHTML += '<br>Creating quote...';
      const qres = await fetch("/create-quote", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          clientId: client.id,
          propertyId,
          lineItemName: $("lineItemName").value,
          unitPrice: $("unitPrice").value,
          quantity: $("quantity").value
        })
      });
      const qdata = await qres.json();
      const quote = qdata?.data?.quoteCreate?.quote;
      const qerrs = qdata?.data?.quoteCreate?.userErrors;
      if (quote && quote.id) {
        $("result").innerHTML += '<br><span class="ok">Created quote #' + (quote.quoteNumber||quote.id) + '</span>';
      } else {
        $("result").innerHTML += '<br><span class="err">Quote error: ' + JSON.stringify(qerrs || qdata) + '</span>';
      }
    }
  } else if (errs && errs.length) {
    $("result").innerHTML = '<span class="err">Jobber error: ' + JSON.stringify(errs) + '</span>';
  } else {
    $("result").innerHTML = '<span class="err">Unexpected response: ' + JSON.stringify(data) + '</span>';
  }
};
</script>
</body>
</html>
